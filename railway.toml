[build]
dockerfilePath = "deploy/docker/Dockerfile.unified"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
startCommand = "python -m uvicorn app.main:create_app --factory --host 0.0.0.0 --port ${PORT:-8080} --app-dir /app/backend"

[service]
internalPort = 8080
