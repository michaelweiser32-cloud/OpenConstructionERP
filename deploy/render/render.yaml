# OpenConstructionERP — Render Blueprint (free plan, single container)
#
# One Docker web service: FastAPI backend + bundled React SPA on one origin.
# Database: external PostgreSQL via DATABASE_URL (recommended: Neon free),
# or nothing → SQLite on Render's EPHEMERAL disk (demo only, data is lost
# on every spin-down / restart / redeploy).
#
# Step-by-step instructions: DEPLOY.md at the repository root.
#
# Render reads blueprints from `render.yaml` at the repo root by default;
# when creating the Blueprint, set "Blueprint Path" to deploy/render/render.yaml.
#
# No secret values live in this file. Values marked `sync: false` are
# prompted for in the Render dashboard when the Blueprint is created;
# JWT_SECRET is generated by Render.

services:
  - type: web
    name: openconstructionerp
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/docker/Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    # Deploy only when you push to the branch you pick in the dashboard.
    autoDeploy: true
    envVars:
      # ── Required secrets ─────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true          # Render generates a random 256-bit value
      - key: ADMIN_EMAIL             # your admin login (created/updated on boot)
        sync: false
      - key: ADMIN_PASSWORD          # >= 12 chars; never reuse an example value
        sync: false

      # ── Database (strongly recommended) ──────────────────────────────
      # Paste Neon's *pooled* connection string. DATABASE_SYNC_URL may stay
      # empty — it is derived automatically. Leave both empty to run on
      # throw-away SQLite.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SYNC_URL
        sync: false

      # ── Runtime / safety (defaults also baked into the image) ────────
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: SERVE_FRONTEND
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: ALLOW_SELF_REGISTRATION
        value: "false"
      - key: ALLOW_FIRST_USER_ADMIN
        value: "false"
      # Demo accounts are OFF. To enable them on a public URL set
      # SEED_DEMO=true, DISABLE_DEMO_ACCOUNTS=0 AND all three
      # DEMO_*_PASSWORD variables (>= 12 chars) — see DEPLOY.md.
      - key: DISABLE_DEMO_ACCOUNTS
        value: "1"
      - key: SEED_DEMO
        value: "false"
      # Same-origin SPA → CORS is not needed. Set this to your public URL
      # (e.g. https://openconstructionerp.onrender.com) once you know it,
      # plus any separate frontend origin (e.g. a Vercel URL).
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: none
      # Optional Host-header allowlist, e.g. "openconstructionerp.onrender.com".
      - key: ALLOWED_HOSTS
        value: "*"
